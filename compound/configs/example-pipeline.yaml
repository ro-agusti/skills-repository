name: "Document Analysis and Processing"
description: "Pipeline that analyzes, extracts information, and formats documents"
version: "1.0.0"

# Global variables
variables:
  output_format: "markdown"
  language: "es"

# Pipeline steps
steps:
  # Step 1: Initial analysis
  - name: "Analyze document"
    type: execute
    skill: "skills/ai-prompts/document-analyzer"
    params:
      language: "$language"
    output_var: "analysis_result"
  
  # Step 2: Conditional based on document type
  - name: "Process based on type"
    type: conditional
    condition: "analysis_result.type == 'technical'"
    then:
      name: "Technical processing"
      skill: "skills/code/technical-processor"
      params:
        detail_level: "high"
    else:
      name: "General processing"
      skill: "skills/code/general-processor"
    output_var: "processed_data"
  
  # Step 3: Parallel execution of extractors
  - name: "Information extraction"
    type: parallel
    combine: merge
    steps:
      - name: "Extract metadata"
        skill: "skills/code/metadata-extractor"
      
      - name: "Extract entities"
        skill: "skills/ai-prompts/entity-extractor"
      
      - name: "Extract keywords"
        skill: "skills/hybrid/keyword-extractor"
    output_var: "extracted_info"
  
  # Step 4: Final formatting
  - name: "Format output"
    type: execute
    skill: "skills/hybrid/formatter"
    params:
      format: "$output_format"
      metadata: "$extracted_info"
      content: "$processed_data"

# Error handling configuration
error_handling:
  on_error: "continue"  # or "stop", "retry"
  retry_count: 3
  retry_delay: 1

# Logging configuration
logging:
  level: "info"
  output: "pipeline_logs/"
