name: "Análisis y Procesamiento de Documentos"
description: "Pipeline que analiza, extrae información y formatea documentos"
version: "1.0.0"

# Variables globales
variables:
  output_format: "markdown"
  language: "es"

# Pasos del pipeline
steps:
  # Paso 1: Análisis inicial
  - name: "Analizar documento"
    type: execute
    skill: "skills/ai-prompts/document-analyzer"
    params:
      language: "$language"
    output_var: "analysis_result"
  
  # Paso 2: Condicional basado en tipo de documento
  - name: "Procesar según tipo"
    type: conditional
    condition: "analysis_result.type == 'technical'"
    then:
      name: "Procesamiento técnico"
      skill: "skills/code/technical-processor"
      params:
        detail_level: "high"
    else:
      name: "Procesamiento general"
      skill: "skills/code/general-processor"
    output_var: "processed_data"
  
  # Paso 3: Ejecución paralela de extractores
  - name: "Extracción de información"
    type: parallel
    combine: merge
    steps:
      - name: "Extraer metadatos"
        skill: "skills/code/metadata-extractor"
      
      - name: "Extraer entidades"
        skill: "skills/ai-prompts/entity-extractor"
      
      - name: "Extraer keywords"
        skill: "skills/hybrid/keyword-extractor"
    output_var: "extracted_info"
  
  # Paso 4: Formateo final
  - name: "Formatear salida"
    type: execute
    skill: "skills/hybrid/formatter"
    params:
      format: "$output_format"
      metadata: "$extracted_info"
      content: "$processed_data"

# Configuración de error handling
error_handling:
  on_error: "continue"  # o "stop", "retry"
  retry_count: 3
  retry_delay: 1

# Configuración de logging
logging:
  level: "info"
  output: "pipeline_logs/"
